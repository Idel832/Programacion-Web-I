<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <title>Cambiar color con JQuery</title>
    </head>
    <body>
        <header>
            <h1>Cambiar color con JQuery</h1>
        </header>

        <p>Primer párrafo</p>
        <p>Segundo párrafo</p>
        <p>Tercer párrafo</p>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <script>
            $(document).ready(function(){
                $("p").css("color","blue");
            });
        </script>

        <footer>

        </footer>
    </body>
</html>
