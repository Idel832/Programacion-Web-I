<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <title>addEventListener</title>
    </head>
    <body>
        <header>
            <h1>Mostrar primos entre 1 y 1000 en consola</h1>
        </header>

        <script>
            for (let numero = 2; numero <=1000; numero++){
                let Primo = true;

                for (let i = 2; i < numero; i++) {
                    if (numero % i === 0) {
                        Primo = false;
                        break
                    }
                }
                
                if (Primo) {
                    console.log(numero);
                }
            }
        </script>
