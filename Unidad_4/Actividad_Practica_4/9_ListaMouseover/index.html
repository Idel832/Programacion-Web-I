<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <title>Evento mouseover</title>
    </head>
    <body>
        <header>
            <h1>Cambiar de color en elemntos de lista mediante mouseover</h1>
        </header>

        <ul>
            <li>Manzana</li>
            <li>Toronja</li>
            <li>Amarillo</li>
            <li>Rojo</li>
        </ul>
        <hr>

        <script>
            let tabla = document.querySelectorAll("li");
            
            tabla.forEach(function(item){
                item.addEventListener("mouseover", function(){
                    item.style.backgroundColor = "blue";
                });
            });
        </script>

        <footer>
            &copy; 2026 Tarea MT-2024-00222 | Todos los derechos reservados
        </footer>
    </body>
</html>
