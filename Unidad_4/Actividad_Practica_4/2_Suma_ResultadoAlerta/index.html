<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <title>Uso de prompt y alert</title>
    </head>
    <body>
        <header>
            <h1>Solicitar un número, multiplicarlo por dos y mostrar el resultado en una alerta</h1>
        </header>

        <script>
          let numero = prompt("Introduzca un número: ");

          let resultado = numero*2;
          
          alert("El resultado es: "+resultado);
        </script>

    </body>
</html>
