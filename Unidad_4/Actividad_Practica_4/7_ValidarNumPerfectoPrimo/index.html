<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <title>Validar Num.Perfecto/Primo</title>
    </head>
    <body>
        <header>
            <h1>Validar si un numero es perfecto y/o primo en consola</h1>
        </header>

        
        <script>
            let numero = Number(prompt("Ingrese un número: "));

            let esPrimo = true;
            let suma = 0;

            for (let i = 2; i < numero; i++){
                if (numero % i ===0){
                    esPrimo = false;
                    break;
                }
            }

            for (let i = 1; i < numero; i++){
                if (numero % i === 0){
                    suma += i;
                }
            }

            let esPerfecto = (suma === numero);

            if (esPrimo && esPerfecto){
                alert("El número ingresado es primo y perfecto.");
            } else if (esPrimo){
                alert("El número ingresado es primo.");
            } else if (esPerfecto) {
                alert("El número ingresado es perfecto.");
            } else {
                alert("El número no es primo ni perfecto")
            }
        </script>

        </footer>
    </body>
</html>
