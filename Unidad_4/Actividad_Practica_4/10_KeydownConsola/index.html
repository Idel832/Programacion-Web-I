<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <title>Evento keydown</title>
    </head>
    <body>
        <header>
            <h1>Registro de teclas presionadas en consola.</h1>
        </header>

        <input type="text" id="CampoTexto" placeholder="Escriba en este campo">
        <hr>

        <script>
            let input = document.getElementById("CampoTexto");

            input.addEventListener("keydown", function(event){
                console.log("La tecla presionada fue:..."+ event.key);
            });
        </script>

        <footer>

        </footer>
    </body>
</html>
